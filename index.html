<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Backpacker</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #11151c;
            --bg-accent: #1b2430;
            --panel: rgba(20, 26, 36, 0.82);
            --text: #ecf0f3;
            --muted: #9aa6b2;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, #24324a 0%, transparent 38%),
                radial-gradient(circle at bottom right, #2a1f3d 0%, transparent 32%),
                linear-gradient(160deg, var(--bg), var(--bg-accent));
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(180deg, rgba(8, 12, 18, 0.2), rgba(8, 12, 18, 0.55));
            backdrop-filter: blur(10px);
        }

        .card {
            width: min(420px, 100%);
            padding: 28px 30px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
            letter-spacing: 0.02em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .spinner {
            width: 28px;
            height: 28px;
            margin: 18px auto 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.18);
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        .error {
            color: #ffb4b4;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.92rem;
            margin-top: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <canvas id="game-canvas"></canvas>

    <div class="loading" id="loading-screen">
        <div class="card">
            <h1>Backpacker</h1>
            <p>Loading the wasm build.</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        delete WebAssembly.instantiateStreaming;
    </script>
    <script type="module">
        const BUILD_TAG = 'server-sync-v2';
        const wasmJsUrl = `./pkg/backpacker.js?v=${BUILD_TAG}`;
        const wasmBinUrl = `./pkg/backpacker_bg.wasm?v=${BUILD_TAG}`;

        const wasmModule = await import(wasmJsUrl);
        const init = wasmModule.default;
        const WebHandle = wasmModule.WebHandle;

        const canvas = document.getElementById("game-canvas");
        const loadingScreen = document.getElementById("loading-screen");

        function showError(message) {
            loadingScreen.innerHTML = `
                <div class="card">
                    <h1>Backpacker failed to start</h1>
                    <p>Check the browser console for the full error.</p>
                    <div class="error">${message}</div>
                </div>`;
        }

        init({ module_or_path: wasmBinUrl })
            .then(() => {
                const handle = new WebHandle();

                const monitor = window.setInterval(() => {
                    if (handle.has_panicked()) {
                        window.clearInterval(monitor);
                        showError("The app panicked. Reload the page after fixing the error in the console.");
                    }
                }, 1000);

                handle.start(canvas)
                    .then(() => {
                        loadingScreen.remove();
                        canvas.focus();
                    })
                    .catch((error) => {
                        window.clearInterval(monitor);
                        showError(String(error));
                    });
            })
            .catch((error) => showError(String(error)));
    </script>
</body>

</html>
