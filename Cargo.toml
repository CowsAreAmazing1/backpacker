[package]
name = "backpacker"
version = "0.1.0"
edition = "2024"
default-run = "backpacker"

[dependencies]
strum = "0.28.0"
colored = "3.0.0"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = "0.10.1"
eframe = "0.34.2"
egui = "0.34.2"
itertools = "0.14.0"
strum_macros = "0.28.0"
tabular = "0.2.0"
term-painter = "0.4.0"
text_io = "0.1.13"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "HtmlCanvasElement",
    "BinaryType",
    "ErrorEvent",
    "Event",
    "Location",
    "MessageEvent",
    "WebSocket",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.38.0", features = ["full"] }
warp = "0.3.6"
futures = "0.3"
webbrowser = "1.0.6"
